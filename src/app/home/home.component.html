<div class="home-container">
  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search Products</mat-label>
      <input matInput type="text" [(ngModel)]="searchTerm" (input)="applyFilter()" placeholder="Search by product name">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="error" class="error-container">
    <p class="error-message">{{ error }}</p>
  </div>

  <div *ngIf="!loading && !error" class="products-grid">
    <mat-card *ngFor="let product of (filteredProducts | async)" class="product-card">
      <mat-card-header>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>{{ product.price | currency }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ product.description | slice:0:100 }}{{ product.description.length > 100 ? '...' : '' }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" (click)="viewProductDetails(product.id)">View Details</button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div *ngIf="!loading && !error && (filteredProducts | async)?.length === 0" class="no-results">
    <p>No products found matching your search criteria.</p>
  </div>
</div>
